<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SMB Business Manager V1</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2333;--mu:#6b7589;--bd:#e3e7ef;--pr:#4f46e5;--ok:#16a34a;--bad:#dc2626;--wa:#d97706;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1420;--card:#182032;--tx:#e8ecf5;--mu:#8e9ab3;--bd:#27314a;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1420;--card:#182032;--tx:#e8ecf5;--mu:#8e9ab3;--bd:#27314a;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#app{display:flex;min-height:100vh}
nav{width:210px;background:var(--card);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}
nav h1{font-size:16px;margin:4px 8px 14px}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mu);padding:10px;border-radius:8px;font:inherit;cursor:pointer}
nav button.on,nav button:hover{background:color-mix(in srgb,var(--pr) 14%,transparent);color:var(--pr)}
main{flex:1;padding:18px;min-width:0;max-width:1200px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.bar h2{margin:0;flex:1;font-size:20px}
.demo{background:color-mix(in srgb,var(--wa) 18%,transparent);border:1px solid var(--wa);padding:8px 12px;border-radius:8px;margin-bottom:14px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}.grid .card{margin:0}
.k{color:var(--mu);font-size:12px}.v{font-size:21px;font-weight:700;margin-top:4px}.pos{color:var(--ok)}.neg{color:var(--bad)}
button.b,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button.b{cursor:pointer}button.p{background:var(--pr);color:#fff;border-color:var(--pr)}button.d{color:var(--bad)}button.s{padding:4px 8px;font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:12px;font-weight:600}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:color-mix(in srgb,var(--pr) 15%,transparent)}.tag.r{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}.tag.g{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
#mod{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:12px;z-index:20}
#mod>div{background:var(--card);border-radius:12px;padding:18px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}label+input,label+select{width:100%}
.row{display:flex;gap:6px}.row>*{flex:1;min-width:0}#err{color:var(--bad);margin-top:8px}
@media print{body>*:not(#mod){display:none!important}#mod{position:static!important;background:none!important;display:block!important}#mod>div{max-height:none}.np{display:none!important}}
#toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;display:none;z-index:30}
@media(max-width:760px){#app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:auto;height:auto;display:flex;overflow-x:auto;border-right:0;border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));z-index:10}
nav h1{display:none}nav button{width:auto;text-align:center;font-size:12px;padding:8px 10px}main{padding:12px 12px 80px}}
</style></head><body>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="mod"><div id="mc"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),D=864e5,M=n=>'RM '+(+n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=d=>new Date(d).toLocaleDateString('en-CA',{timeZone:'Asia/Kuala_Lumpur'}),dt=s=>String(s).split('-').reverse().join('/');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST=['New','Pending payment','Processing','Ready to ship','Shipped','Completed','Cancelled','Returned'],PM=['Cash','Bank transfer','DuitNow QR','E-wallet','Other'],PL={today:'Today',yesterday:'Yesterday',week:'This week',month:'This month',lastmonth:'Last month',year:'This year'},act=o=>o.status!='Cancelled'&&o.status!='Returned';
const KEY='smb_demo_v2';let LANG='ms',S,P='month',V='dash',busy=false;try{LANG=localStorage.getItem('smb_lang')||'ms'}catch(e){}
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.background=bad?'#dc2626':'';t.style.color=bad?'#fff':'';t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('NOT SAVED: browser storage unavailable. Changes exist only until you close this page.',1);return false}}
const today=()=>iso(Date.now()),ago=n=>iso(Date.now()-n*D),pr=id=>S.products.find(p=>p.id==id),cu=id=>S.customers.find(c=>c.id==id);
const tot=o=>o.items.reduce((a,i)=>a+i.qty*i.price,0)-o.disc+o.ship;const bal=o=>tot(o)-o.paid;
function move(pid,q,why,date){const p=pr(pid);p.stock+=q;S.moves.push({date:date||today(),pid,qty:q,why,after:p.stock})}
function addTx(type,cat,amt,ref,date,note){if(ref&&S.tx.some(t=>t.ref==ref&&t.cat==cat))return;S.tx.push({id:'TX-'+(++S.txs),date:date||today(),type,cat,amt,ref:ref||'',note:note||''})}
function place(d){const need={};d.items.forEach(i=>{if(!(i.qty>0))throw Error('Quantity must be at least 1');if(i.price<0)throw Error('Invalid price');need[i.pid]=(need[i.pid]||0)+i.qty});
 if(!d.items.length)throw Error('Add at least one product');
 for(const k in need){if(pr(k).stock<need[k])throw Error('Insufficient stock for '+pr(k).name+' (available '+pr(k).stock+')')}
 if(d.disc>d.items.reduce((a,i)=>a+i.qty*i.price,0))throw Error('Discount exceeds subtotal');
 const o={id:'ORD-'+String(++S.seq).padStart(4,'0'),date:d.date||today(),cust:d.cust,items:d.items.map(i=>({...i,cost:pr(i.pid).cost})),disc:d.disc||0,ship:d.ship||0,method:d.method,paid:0,status:d.status||'New'};
 S.orders.push(o);o.items.forEach(i=>move(i.pid,-i.qty,'Sale '+o.id,o.date));if(d.paid)pay(o,tot(o),d.method,o.date);return o}
function pay(o,amt,method,date){amt=Math.round(amt*100)/100;if(!(amt>0))throw Error('Amount must be positive');if(!act(o))throw Error('Order is cancelled or returned');if(amt>bal(o)+.001)throw Error('Payment exceeds outstanding balance');const id='PAY-'+(++S.pays.n);S.pays.list.push({id,order:o.id,amt,method,date:date||today()});o.paid=Math.round((o.paid+amt)*100)/100;addTx('income','Product sales',amt,id,date,'Payment '+o.id+' ('+method+')')}
function setStatus(o,ns){const was=act(o),will=ns!='Cancelled'&&ns!='Returned';
 if(!was&&will){o.items.forEach(i=>{if(pr(i.pid).stock<i.qty)throw Error('Cannot reactivate: insufficient stock for '+pr(i.pid).name)});o.items.forEach(i=>move(i.pid,-i.qty,'Reactivated '+o.id))}
 if(was&&!will){o.items.forEach(i=>move(i.pid,i.qty,ns+' '+o.id));if(o.paid>0){addTx('expense','Refund',o.paid,o.id+'-R'+ns,today(),'Refund '+o.id);o.paid=0}}
 o.status=ns}
function seed(){S={seq:0,txs:0,pays:{n:0,list:[]},biz:{name:'Perniagaan Saya Sdn Bhd',info:'Tel: 012-3456789 · Kuala Lumpur'},products:[],customers:[],suppliers:[],orders:[],moves:[],tx:[],pid:0};
 [['Acme Supply','sales@acme.test'],['Fresh Goods Co','+1 555 0102'],['PackIt Ltd','hello@packit.test']].forEach((s,i)=>S.suppliers.push({id:i+1,name:s[0],contact:s[1],owed:i==0?120:0}));
 [['Coffee Beans 1kg','Food',9,18,40,10,2],['Green Tea 100g','Food',4,9.5,60,15,2],['Ceramic Mug','Home',3,8,25,10,1],['Tote Bag','Apparel',2.5,7,8,10,3],['Notebook A5','Stationery',1.2,4,90,20,3],['Gift Box','Packaging',2,6,6,8,3],['Honey Jar','Food',5,12,30,10,2],['Water Bottle','Home',6,15,18,8,1]]
 .forEach((p,i)=>{S.products.push({id:++S.pid,sku:'SKU-'+String(100+i),bc:'9555000'+String(10000+i),name:p[0],cat:p[1],cost:p[2],price:p[3],stock:0,min:p[5],sup:p[6]});move(S.pid,p[4]+30,'Opening stock',ago(40))});
 ['Aisha Rahman|012-3456789|12 Jln Palma, KL','Ben Tan|011-22334455|88 Jln Tasik, PJ','Chen Wei|016-7788990|5 Jln Bukit, Ipoh','Dina Lopez|017-5566778|31 Jln Oak, JB','Walk-in customer||'].forEach((c,i)=>{const a=c.split('|');S.customers.push({id:i+1,name:a[0],phone:a[1],addr:a[2]})});
 const sts=['Completed','Completed','Completed','Shipped','Processing','New','Completed','Cancelled','Returned','Completed','Pending payment','Completed'];
 for(let i=0;i<24;i++){const n=1+i%3,items=[];for(let j=0;j<n;j++){const p=S.products[(i*3+j*2)%8];if(!items.some(x=>x.pid==p.id))items.push({pid:p.id,qty:1+(i+j)%3,price:p.price})}
  try{const o=place({date:ago(Math.floor(i*1.6)),cust:1+i%5,items,disc:i%4==0?2:0,ship:i%2?3:0,method:['Cash','Bank transfer','DuitNow QR'][i%3],paid:i%5!=4&&i%7!=5,status:'New'});
  const t=sts[i%12];if(t!='New')setStatus(o,t);if(i==4&&act(o))pay(o,5,'Cash',o.date)}catch(e){}}
 addTx('expense','Stock purchase',300,'SEED1',ago(30),'Initial stock');addTx('expense','Business expenses',150,'SEED2',ago(20),'Rent share');addTx('expense','Packaging',45,'SEED3',ago(9),'Boxes');addTx('expense','Delivery fees',38,'SEED4',ago(5),'Courier');addTx('income','Other income',60,'SEED5',ago(3),'Workshop');save()}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S)seed();
function from(p){let d=new Date();d.setHours(0,0,0,0);if(p=='week')d=new Date(+d-6*D);if(p=='month')d.setDate(1);if(p=='year')d.setMonth(0,1);return iso(d)}
function stats(f,t){t=t||'9999';const os=S.orders.filter(o=>act(o)&&o.date>=f&&o.date<=t),tx=S.tx.filter(x=>x.date>=f&&x.date<=t);
 const sales=os.reduce((a,o)=>a+tot(o),0),cogs=os.reduce((a,o)=>a+o.items.reduce((b,i)=>b+i.qty*i.cost,0),0),
 inc=tx.filter(x=>x.type=='income').reduce((a,x)=>a+x.amt,0),exp=tx.filter(x=>x.type=='expense').reduce((a,x)=>a+x.amt,0),
 opex=tx.filter(x=>x.type=='expense'&&x.cat!='Stock purchase'&&x.cat!='Refund').reduce((a,x)=>a+x.amt,0);
 return{os,sales,cogs,inc,exp,gross:sales-cogs,net:sales-cogs-opex,cash:inc-exp}}
const outstanding=()=>S.orders.filter(act).reduce((a,o)=>a+bal(o),0),rng=p=>p=='yesterday'?[ago(1),ago(1)]:p=='lastmonth'?(d=>[iso(new Date(d.getFullYear(),d.getMonth()-1,1,12)),iso(new Date(d.getFullYear(),d.getMonth(),0,12))])(new Date()):[from(p),'9999'];
const tbl=(h,r,e)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.map(x=>`<tr>${x.map(c=>`<td>${/^\d{4}-\d\d-\d\d$/.test(c)?dt(c):c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}">${e||'Nothing here yet'}</td></tr>`}</table></div>`;
const tag=(t,c)=>`<span class="tag ${c||''}">${esc(t)}</span>`;
function chart(){let keys=[],fn;const d=new Date();
 if(P=='year'){for(let m=0;m<12;m++)keys.push(d.getFullYear()+'-'+String(m+1).padStart(2,'0'));fn=x=>x.slice(0,7)}
 else{const n=P=='month'?new Date().getDate():7;for(let i=n-1;i>=0;i--)keys.push(ago(i));fn=x=>x}
 const v=keys.map(k=>S.orders.filter(o=>act(o)&&fn(o.date)==k).reduce((a,o)=>a+tot(o),0)),mx=Math.max(1,...v),w=100/keys.length;
 return `<svg viewBox="0 0 400 150" width="100%" style="display:block">${v.map((x,i)=>{const h=x/mx*110;return `<rect x="${i*400/keys.length+2}" y="${125-h}" width="${400/keys.length-4}" height="${h}" rx="3" fill="var(--pr)"><title>${keys[i]}: ${M(x)}</title></rect>`}).join('')}<text x="0" y="145" font-size="9" fill="var(--mu)">${keys[0]}</text><text x="400" y="145" font-size="9" text-anchor="end" fill="var(--mu)">${keys[keys.length-1]}</text></svg>`}
const views={
dash(){const s=stats(...rng(P)),low=S.products.filter(p=>p.stock<=p.min),pend=S.orders.filter(o=>o.status=='New'||o.status=='Pending payment').length,sv=S.products.reduce((a,p)=>a+p.stock*p.cost,0);
 const c=(k,v,x)=>`<div class="card"><div class="k">${k}</div><div class="v ${x||''}">${v}</div></div>`;
 return `<div class="bar"><h2>Dashboard</h2>${['today','yesterday','week','month','lastmonth','year'].map(p=>`<button class="b ${p==P?'p':''}" onclick="P='${p}';go('dash')">${PL[p]}</button>`).join('')}</div>
 <div class="grid">${c('Total sales',M(s.sales))}${c('Total expenses',M(s.exp))}${c('Net profit',M(s.net),s.net<0?'neg':'pos')}${c('Products',S.products.length)}${c('Stock value (cost)',M(sv))}${c('Pending orders',pend)}${c('Cash received',M(s.inc))}${c('Out of stock',S.products.filter(p=>p.stock<=0).length)}${c('Low-stock alerts',low.length,low.length?'neg':'')}${c('Outstanding payments',M(outstanding()))}</div>
 <div class="card"><b>Sales performance</b>${chart()}</div>
 <div class="card"><b>Low stock</b>${tbl(['Product','Stock','Min'],low.map(p=>[esc(p.name),tag(p.stock,'r'),p.min]),'All stock levels healthy')}</div>
 <div class="card"><b>Recent transactions</b>${tbl(['Date','Type','Category','Amount'],S.tx.slice(-8).reverse().map(t=>[t.date,tag(t.type,t.type=='income'?'g':'r'),esc(t.cat),M(t.amt)]))}</div>`},
inv(){return `<div class="bar"><h2>Inventory</h2><button class="b" onclick="buyForm()">Receive stock</button><button class="b p" onclick="prodForm()">+ Add product</button></div>
 <div class="card">${tbl(['SKU','Name','Category','Supplier','Cost','Price','Stock','Min',''],S.products.map(p=>[p.sku,esc(p.name),esc(p.cat),esc((S.suppliers.find(s=>s.id==p.sup)||{}).name||'-'),M(p.cost),M(p.price),p.stock<=p.min?tag(p.stock,'r'):p.stock,p.min,`<button class="b s" onclick="adjForm(${p.id})">Adjust</button> <button class="b s" onclick="prodForm(${p.id})">Edit</button> <button class="b s d" onclick="delProd(${p.id})">Delete</button>`]))}</div>
 <div class="card"><b>Stock movement history</b>${tbl(['Date','Product','Change','Reason','Balance'],S.moves.slice(-25).reverse().map(m=>[m.date,esc(pr(m.pid)?.name),m.qty>0?'+'+m.qty:m.qty,esc(m.why),m.after]))}</div>`},
ord(){return `<div class="bar"><h2>Orders</h2><button class="b p" onclick="ordForm()">+ New order</button></div><div class="card">${tbl(['Order','Date','Customer','Items','Total','Payment','Status',''],S.orders.slice().reverse().map(o=>[o.id,o.date,esc(cu(o.cust)?.name),o.items.map(i=>esc(pr(i.pid)?.name)+' ×'+i.qty).join(', '),M(tot(o)),payCell(o),`<select onchange="chSt('${o.id}',this.value)">${ST.map(s=>`<option value="${s}" ${s==o.status?'selected':''}>${s}</option>`).join('')}</select>`,`<button class="b s" onclick="invModal('${o.id}')">Invoice</button> <button class="b s" onclick="waModal('${o.id}')">WhatsApp</button>`]))}</div>`},
fin(){const a=stats('0000');return `<div class="bar"><h2>Finance</h2><button class="b p" onclick="txForm()">+ Record transaction</button></div>
 <div class="grid">${[['Total income',M(a.inc)],['Total expenses',M(a.exp)],['Gross profit',M(a.gross)],['Net profit',M(a.net)],['Outstanding payments',M(outstanding())],['Cash flow',M(a.cash)]].map(x=>`<div class="card"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join('')}</div>
 <div class="card"><small class="k">Gross profit = sales (non-cancelled orders) − cost of goods sold. Net profit = gross − operating expenses (stock purchases are counted via COGS; refunds are excluded since cancelled sales are removed). Cash flow = income received − all expenses paid.</small>${tbl(['ID','Date','Type','Category','Amount','Note'],S.tx.slice().reverse().map(t=>[t.id,t.date,tag(t.type,t.type=='income'?'g':'r'),esc(t.cat),M(t.amt),esc(t.note)]))}</div>`},
cus(){return `<div class="bar"><h2>Customers</h2><button class="b p" onclick="entForm('customers')">+ Add customer</button></div><div class="card">${tbl(['Name','Phone','Address','Orders','Total spent','Outstanding'],S.customers.map(c=>{const os=S.orders.filter(o=>o.cust==c.id&&act(o));return[esc(c.name),esc(c.phone),esc(c.addr),os.length,M(os.reduce((a,o)=>a+tot(o),0)),M(os.reduce((a,o)=>a+bal(o),0))]}))}</div>`},
sup(){return `<div class="bar"><h2>Suppliers</h2><button class="b p" onclick="entForm('suppliers')">+ Add supplier</button></div><div class="card">${tbl(['Name','Contact','Products supplied','Purchases','Owed',''],S.suppliers.map(s=>[esc(s.name),esc(s.contact),S.products.filter(p=>p.sup==s.id).map(p=>esc(p.name)).join(', ')||'-',S.tx.filter(t=>t.cat=='Stock purchase'&&t.ref.startsWith('S'+s.id+':')).length,M(s.owed),s.owed>0?`<button class="b s" onclick="paySup(${s.id})">Pay</button>`:'']))}</div>`},
bar(){return `<div class="bar"><h2>Barcode</h2></div><div class="card"><label>Scan or type barcode / SKU (USB scanners type then press Enter)</label><input id="bq" onkeydown="if(event.key=='Enter')bcFind()"><div id="bres" style="margin-top:12px"></div></div><div class="card"><b>Demo barcodes</b>${tbl(['Product','Barcode','SKU'],S.products.map(p=>[esc(p.name),esc(p.bc),p.sku]))}</div>`},
rep(){const r=report(R);return `<div class="bar"><h2>Reports</h2><select onchange="R=this.value;go('rep')">${Object.keys(REP).map(k=>`<option value="${k}" ${k==R?'selected':''}>${k}</option>`).join('')}</select><button class="b" onclick="csv(true)">Download CSV</button><button class="b" onclick="csv(false)">Copy CSV</button></div><div class="card">${tbl(r.h,r.r.map(x=>x.map(esc)))}</div><small class="k">CSV opens directly in Excel. Native .xlsx export needs the full build.</small>`}};
let R='Daily sales (14 days)';
const REP={'Daily sales (14 days)':()=>({h:['Date','Orders','Sales'],r:Array.from({length:14},(_,i)=>{const d=ago(i),s=stats(d,d);return[d,s.os.length,M(s.sales)]})}),
'Weekly sales (8 weeks)':()=>({h:['Week starting','Orders','Sales'],r:Array.from({length:8},(_,i)=>{const a=ago(i*7+6),b=ago(i*7),s=stats(a,b);return[a,s.os.length,M(s.sales)]})}),
'Monthly financial (6 months)':()=>({h:['Month','Sales','COGS','Gross','Expenses','Net','Cash flow'],r:Array.from({length:6},(_,i)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const a=iso(d),e=new Date(d.getFullYear(),d.getMonth()+1,0),s=stats(a,iso(e));return[a.slice(0,7),M(s.sales),M(s.cogs),M(s.gross),M(s.exp),M(s.net),M(s.cash)]})}),
'Stock movements':()=>({h:['Date','SKU','Product','Change','Reason','Balance'],r:S.moves.slice().reverse().map(m=>[m.date,pr(m.pid)?.sku,pr(m.pid)?.name,m.qty,m.why,m.after])}),
'Best-selling products':()=>{const m={};S.orders.filter(act).forEach(o=>o.items.forEach(i=>{m[i.pid]=m[i.pid]||{q:0,r:0};m[i.pid].q+=i.qty;m[i.pid].r+=i.qty*i.price}));return{h:['Product','Units sold','Revenue'],r:Object.entries(m).sort((a,b)=>b[1].q-a[1].q).map(([k,v])=>[pr(k)?.name,v.q,M(v.r)])}},
'Low stock':()=>({h:['SKU','Product','Stock','Minimum'],r:S.products.filter(p=>p.stock<=p.min).map(p=>[p.sku,p.name,p.stock,p.min])}),
'Profit & loss (this month)':()=>{const s=stats(from('month'));return{h:['Line','Amount'],r:[['Sales',M(s.sales)],['Cost of goods sold',M(-s.cogs)],['Gross profit',M(s.gross)],['Operating expenses',M(s.gross-s.net)],['Net profit',M(s.net)]]}}};
const report=k=>REP[k]();
function csv(dl){const r=report(R),t=[r.h,...r.r].map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');
 if(!dl){navigator.clipboard?.writeText(t).then(()=>toast('CSV copied'),()=>toast('Copy blocked by browser',1));return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=R.replace(/\W+/g,'_')+'.csv';a.click();toast('If nothing downloaded, use Copy CSV (downloads can be blocked here)')}catch(e){toast('Download blocked; use Copy CSV',1)}}
function modal(title,html,ok){$('#mc').innerHTML=L(`<h3 style="margin-top:0">${title}</h3>${html}<div id="err"></div><div class="row" style="margin-top:14px"><button class="b" onclick="closeM()">Cancel</button><button class="b p" id="okb">Save</button></div>`);$('#mod').style.display='flex';
 $('#okb').onclick=()=>{if(busy)return;busy=true;try{const snap=JSON.stringify(S);try{ok();if(!save()){S=JSON.parse(snap);throw Error('Save failed; change rolled back')}closeM();go(V)}catch(e){S=JSON.parse(snap);$('#err').textContent=e.message}}finally{busy=false}}}
const closeM=()=>$('#mod').style.display='none',g=id=>$('#'+id).value,n=id=>parseFloat(g(id))||0;
const opts=(a,sel)=>a.map(x=>`<option value="${x.id}" ${x.id==sel?'selected':''}>${esc(x.name)}</option>`).join('');
const f=(id,l,v,t)=>`<label>${l}</label><input id="${id}" type="${t||'text'}" value="${esc(v??'')}" ${t=='number'?'step="any" min="0"':''}>`;
function prodForm(id){const p=id?pr(id):{};modal(id?'Edit product':'New product',f('a','SKU',p.sku||'SKU-'+(100+S.pid))+f('k','Barcode',p.bc)+f('b','Name',p.name)+f('c','Category',p.cat)+`<label>Supplier</label><select id="d">${opts(S.suppliers,p.sup)}</select><div class="row"><div>${f('e','Purchase cost',p.cost,'number')}</div><div>${f('h','Selling price',p.price,'number')}</div></div><div class="row"><div>${f('i','Min stock alert',p.min??5,'number')}</div>${id?'':`<div>${f('j','Opening stock',0,'number')}</div>`}</div>`,()=>{
 if(!g('b').trim())throw Error('Name required');if(S.products.some(x=>x.sku==g('a')&&x.id!=id))throw Error('SKU already exists');
 const o={sku:g('a'),bc:g('k').trim(),name:g('b').trim(),cat:g('c')||'General',sup:+g('d'),cost:n('e'),price:n('h'),min:n('i')};
 if(id)Object.assign(pr(id),o);else{S.products.push({id:++S.pid,stock:0,...o});if(n('j')>0)move(S.pid,n('j'),'Opening stock')}})}
function delProd(id){if(S.orders.some(o=>o.items.some(i=>i.pid==id)&&act(o)&&o.status!='Completed'))return toast('Product is on open orders',1);if(!confirm('Delete '+pr(id).name+'?'))return;const snap=JSON.stringify(S);S.products=S.products.filter(p=>p.id!=id);if(!save())S=JSON.parse(snap);go(V)}
function buyForm(){modal('Receive stock (purchase)',`<label>Product</label><select id="a">${opts(S.products)}</select>${f('b','Quantity',1,'number')}${f('c','Unit cost',S.products[0].cost,'number')}<label>Paid now?</label><select id="d"><option value="1">Paid</option><option value="0">On credit (owe supplier)</option></select>`,()=>{
 const p=pr(g('a')),q=n('b'),c=n('c');if(!(q>0))throw Error('Quantity must be positive');const amt=q*c,paid=g('d')=='1';p.cost=(p.stock*p.cost+q*c)/(p.stock+q);move(p.id,q,'Purchase');
 if(paid)addTx('expense','Stock purchase',amt,'S'+p.sup+':'+Date.now(),today(),'Purchase '+p.name);else{S.suppliers.find(s=>s.id==p.sup).owed+=amt}})}
function paySup(id){const s=S.suppliers.find(x=>x.id==id);if(!confirm('Pay '+M(s.owed)+' to '+s.name+'?'))return;const snap=JSON.stringify(S);addTx('expense','Stock purchase',s.owed,'S'+id+':pay'+Date.now(),today(),'Supplier payment');s.owed=0;if(!save())S=JSON.parse(snap);go(V)}
function entForm(k){modal('New '+k.slice(0,-1),f('a','Name')+f('b',k=='customers'?'Phone':'Contact')+(k=='customers'?f('c','Address'):''),()=>{if(!g('a').trim())throw Error('Name required');const id=Math.max(0,...S[k].map(x=>x.id))+1;S[k].push(k=='customers'?{id,name:g('a').trim(),phone:g('b'),addr:g('c')}:{id,name:g('a').trim(),contact:g('b'),owed:0})})}
function txForm(){modal('Record transaction',`<label>Type</label><select id="a"><option>income</option><option>expense</option></select><label>Category</label><select id="b">${['Other income','Customer payment','Delivery fees','Packaging','Business expenses','Other costs'].map(x=>`<option>${x}</option>`).join('')}</select>${f('c','Amount',0,'number')}${f('d','Note')}`,()=>{if(!(n('c')>0))throw Error('Amount must be positive');addTx(g('a'),g('b'),n('c'),'',today(),g('d'))})}
function ordForm(){const line=()=>`<div class="row ln" style="margin-top:6px"><select onchange="this.parentNode.querySelector('.pp').value=pr(this.value).price;calc()">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${p.stock})</option>`).join('')}</select><input class="qq" type="number" min="1" value="1" oninput="calc()"><input class="pp" type="number" step="any" value="${S.products[0].price}" oninput="calc()"></div>`;
 window.addLn=()=>{$('#lines').insertAdjacentHTML('beforeend',line());calc()};window.calc=()=>{let t=0;document.querySelectorAll('.ln').forEach(l=>t+=l.querySelector('.qq').value*l.querySelector('.pp').value);$('#tt').textContent=M(t-n('di')+n('sh'))};
 modal('New order',`<label>Customer</label><select id="cu">${opts(S.customers)}</select><label>Items (product · qty · unit price)</label><div id="lines">${line()}</div><button class="b s" type="button" onclick="addLn()" style="margin-top:6px">+ line</button><div class="row"><div><label>Discount</label><input id="di" type="number" min="0" value="0" oninput="calc()"></div><div><label>Delivery</label><input id="sh" type="number" min="0" value="0" oninput="calc()"></div></div><div class="row"><div><label>Payment method</label><select id="pm">${PM.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div><div><label>Payment</label><select id="pd"><option value="0">Unpaid</option><option value="1">Paid</option></select></div></div><p><b>Total: <span id="tt">${M(S.products[0].price)}</span></b></p>`,()=>{
 const items=[...document.querySelectorAll('.ln')].map(l=>({pid:+l.querySelector('select').value,qty:+l.querySelector('.qq').value,price:+l.querySelector('.pp').value}));
 place({cust:+g('cu'),items,disc:n('di'),ship:n('sh'),method:g('pm'),paid:g('pd')=='1'})})}
function chSt(id,s){const o=S.orders.find(x=>x.id==id),snap=JSON.stringify(S);try{setStatus(o,s);if(!save())throw Error('Save failed; rolled back')}catch(e){S=JSON.parse(snap);toast(e.message,1)}go(V)}

const T=k=>LANG=='ms'&&BM[k]||k,tx=t=>{const k=t.trim();return LANG=='ms'&&BM[k]?t.replace(k,BM[k]):t},L=h=>h.replace(/>([^<>]+)</g,(m,t)=>'>'+tx(t)+'<');
const payCell=o=>{const b=bal(o);return(o.paid<=0?tag('Unpaid','r'):b<=.005?tag('Paid','g'):tag('Partial','')+' '+M(b))+(act(o)&&b>.005?` <button class="b s" onclick="payForm('${o.id}')">Add payment</button>`:'')};
function setLang(){LANG=LANG=='ms'?'en':'ms';try{localStorage.setItem('smb_lang',LANG)}catch(e){}go(V)}
const AT={'Stock received':1,'Stock returned':1,'Damaged stock':-1,'Lost stock':-1,'Manual adjustment':0};
function adjForm(id){const p=pr(id);modal(p.name+' ('+p.stock+')',`<label>Type</label><select id="at">${Object.keys(AT).map(k=>`<option value="${k}">${k}</option>`).join('')}</select>${f('aq','Quantity (manual adjustment: use - to reduce)',1,'number')}${f('an','Note')}`,()=>{const p=pr(id),k=g('at');let q=n('aq');if(AT[k])q=Math.abs(q)*AT[k];if(!q)throw Error('Enter a quantity');if(p.stock+q<0)throw Error('Stock cannot go negative (available '+p.stock+')');move(p.id,q,k+(g('an')?': '+g('an'):''))})}
function payForm(id){const o=S.orders.find(x=>x.id==id);modal('Add payment',`<p>${o.id} · <b>${M(bal(o))}</b></p>`+f('pa','Amount',bal(o).toFixed(2),'number')+`<label>Payment method</label><select id="pmx">${PM.map(x=>`<option value="${x}">${x}</option>`).join('')}</select>`,()=>pay(S.orders.find(x=>x.id==id),n('pa'),g('pmx')))}
const wa=p=>{p=String(p||'').replace(/\D/g,'');return p.startsWith('0')?'6'+p:p};
function waModal(id){const o=S.orders.find(x=>x.id==id),c=cu(o.cust),u=wa(c.phone),z=S.biz.name,it=o.items.map(i=>pr(i.pid)?.name+' x'+i.qty).join(', '),ms=LANG=='ms',a=c.name,m=[['Order confirmation',ms?`Hai ${a}, terima kasih atas pesanan ${o.id} dari ${z}: ${it}. Jumlah ${M(tot(o))}, dibayar ${M(o.paid)}, baki ${M(bal(o))}.`:`Hi ${a}, thank you for your order ${o.id} from ${z}: ${it}. Total ${M(tot(o))}, paid ${M(o.paid)}, balance ${M(bal(o))}.`],['Payment reminder',ms?`Hai ${a}, peringatan mesra: pesanan ${o.id} mempunyai baki ${M(bal(o))}. Terima kasih!`:`Hi ${a}, friendly reminder: order ${o.id} has an outstanding balance of ${M(bal(o))}. Thank you!`],['Delivery update',ms?`Hai ${a}, status pesanan ${o.id}: ${T(o.status)}.`:`Hi ${a}, your order ${o.id} status: ${o.status}.`]];
$('#mc').innerHTML='<h3 style="margin-top:0">WhatsApp · '+o.id+'</h3>'+(u?m.map(x=>`<p><a target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none;padding:10px;border-radius:8px;background:var(--pr);color:#fff" href="https://wa.me/${u}?text=${encodeURIComponent(x[1])}">${T(x[0])}</a></p>`).join(''):'<p class="neg">No phone number</p>')+`<button class="b" onclick="closeM()">${T('Close')}</button>`;$('#mod').style.display='flex'}
function invModal(id){const o=S.orders.find(x=>x.id==id),c=cu(o.cust),b=S.biz,st=o.paid<=0?'Unpaid':bal(o)<=.005?'Paid':'Partially paid';
$('#mc').innerHTML=L(`<div><h3 style="margin:0">${esc(b.name)}</h3><small>${esc(b.info)}</small><hr><b>${T('Invoice').toUpperCase()} ${o.id.replace('ORD','INV')}</b> · ${dt(o.date)} · ${T(st)}<br>${esc(c.name)} ${esc(c.phone)}<br>${esc(c.addr)}`+tbl(['SKU','Name','Quantity','Price',T('Total')],o.items.map(i=>[pr(i.pid)?.sku,esc(pr(i.pid)?.name),i.qty,M(i.price),M(i.qty*i.price)]))+`<p>${T('Discount')}: -${M(o.disc)}<br>${T('Delivery')}: ${M(o.ship)}<br><b>${T('Total')}: ${M(tot(o))}</b><br>${T('Paid')}: ${M(o.paid)}<br><b>${T('Balance due')}: ${M(bal(o))}</b></p></div><div class="row np"><button class="b" onclick="closeM()">Close</button><button class="b" onclick="print()">Print / Save PDF</button></div>`);$('#mod').style.display='flex'}
function bcFind(){const q=g('bq').trim().toLowerCase(),p=S.products.find(x=>x.bc.toLowerCase()==q||x.sku.toLowerCase()==q);$('#bres').innerHTML=L(p?`<b>${esc(p.name)}</b><br>${M(p.price)} · Stock: ${p.stock}<br><button class="b p s" onclick="adjForm(${p.id})">Stock in/out</button>`:'<span class="neg">No product found</span>')}
